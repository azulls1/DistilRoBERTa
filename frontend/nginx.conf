server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash: caché larga. Si no existen (pestaña de un despliegue anterior) → 404 y el
    # router recarga la versión nueva (ver withNavigationErrorHandler en app.config.ts).
    location ~* \.(?:js|css|woff2?|ico|png|svg|mp3|gif|jpg|jpeg|webp)$ {
        include /etc/nginx/seguridad-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        include /etc/nginx/seguridad-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: rutas del router de Angular (index.html siempre fresco)
    location / {
        include /etc/nginx/seguridad-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
