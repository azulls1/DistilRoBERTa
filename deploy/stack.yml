# Docker Swarm · VPS iaGentek · https://distilroberta.iagentek.com.mx
# Despliegue: deploy/deploy.sh (construye con el sha del commit y exporta TAG).
version: "3.8"

x-reinicio: &reinicio
  # "any": un servicio que sale con código 0 también se relanza (con on-failure se queda en 0/1)
  condition: any
  delay: 5s
  window: 60s

services:
  api:
    image: distilroberta-backend:${TAG}
    environment:
      - DATABASE_URL_FILE=/run/secrets/distilroberta_db_dsn
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RESULT_URL=redis://redis:6379/1
      - CORS_ORIGINS=https://distilroberta.iagentek.com.mx
    secrets: [distilroberta_db_dsn]
    volumes: [paquetes:/data/paquetes]
    networks: [interna, iagenteknet, supabase_maestria]
    deploy:
      replicas: 1
      restart_policy: *reinicio
      resources: { limits: { memory: 768M, cpus: "1.0" } }
      update_config: { order: start-first, failure_action: rollback }
      labels:
        - traefik.enable=true
        - traefik.docker.network=iagenteknet
        - traefik.http.routers.distilroberta-api.rule=Host(`distilroberta.iagentek.com.mx`) && PathPrefix(`/api`)
        - traefik.http.routers.distilroberta-api.entrypoints=websecure
        - traefik.http.routers.distilroberta-api.tls.certresolver=letsencryptresolver
        # Prioridad explícita ALTA: debe ganarle al router del frontend (Host a secas)
        - traefik.http.routers.distilroberta-api.priority=100
        - traefik.http.routers.distilroberta-api.service=distilroberta-api
        - traefik.http.routers.distilroberta-api.middlewares=distilroberta-hsts,distilroberta-cabeceras-api,distilroberta-limite,distilroberta-cuerpo
        # Escrituras (clasificar, generar ZIP): límite más estricto por IP
        - traefik.http.routers.distilroberta-api-escritura.rule=Host(`distilroberta.iagentek.com.mx`) && PathPrefix(`/api`) && Method(`POST`)
        - traefik.http.routers.distilroberta-api-escritura.entrypoints=websecure
        - traefik.http.routers.distilroberta-api-escritura.tls.certresolver=letsencryptresolver
        - traefik.http.routers.distilroberta-api-escritura.priority=110
        - traefik.http.routers.distilroberta-api-escritura.service=distilroberta-api
        - traefik.http.routers.distilroberta-api-escritura.middlewares=distilroberta-hsts,distilroberta-cabeceras-api,distilroberta-limite-escritura,distilroberta-cuerpo
        - traefik.http.services.distilroberta-api.loadbalancer.server.port=8000
        # Middlewares propios del stack (no se toca la configuración global de Traefik)
        - traefik.http.middlewares.distilroberta-hsts.headers.stsSeconds=31536000
        - traefik.http.middlewares.distilroberta-hsts.headers.stsIncludeSubdomains=false
        - traefik.http.middlewares.distilroberta-cabeceras-api.headers.contentTypeNosniff=true
        - traefik.http.middlewares.distilroberta-cabeceras-api.headers.frameDeny=true
        - traefik.http.middlewares.distilroberta-cabeceras-api.headers.referrerPolicy=no-referrer
        - traefik.http.middlewares.distilroberta-limite.ratelimit.average=20
        - traefik.http.middlewares.distilroberta-limite.ratelimit.period=1s
        - traefik.http.middlewares.distilroberta-limite.ratelimit.burst=60
        - traefik.http.middlewares.distilroberta-limite-escritura.ratelimit.average=20
        - traefik.http.middlewares.distilroberta-limite-escritura.ratelimit.period=1m
        - traefik.http.middlewares.distilroberta-limite-escritura.ratelimit.burst=10
        - traefik.http.middlewares.distilroberta-cuerpo.buffering.maxRequestBodyBytes=8192

  worker:
    image: distilroberta-backend:${TAG}
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-n", "clasificador@%h"]
    environment:
      - DATABASE_URL_FILE=/run/secrets/distilroberta_db_dsn
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RESULT_URL=redis://redis:6379/1
    secrets: [distilroberta_db_dsn]
    volumes: [paquetes:/data/paquetes]
    networks: [interna, supabase_maestria]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d clasificador@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy: *reinicio
      resources: { limits: { memory: 2G, cpus: "2.0" } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy: *reinicio
      resources: { limits: { memory: 192M } }

  web:
    image: distilroberta-frontend:${TAG}
    networks: [iagenteknet]
    deploy:
      replicas: 1
      restart_policy: *reinicio
      resources: { limits: { memory: 128M, cpus: "0.5" } }
      update_config: { order: start-first, failure_action: rollback }
      labels:
        - traefik.enable=true
        - traefik.docker.network=iagenteknet
        - traefik.http.routers.distilroberta-web.rule=Host(`distilroberta.iagentek.com.mx`)
        - traefik.http.routers.distilroberta-web.entrypoints=websecure
        - traefik.http.routers.distilroberta-web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.distilroberta-web.priority=10
        - traefik.http.routers.distilroberta-web.service=distilroberta-web
        - traefik.http.routers.distilroberta-web.middlewares=distilroberta-hsts,distilroberta-limite
        - traefik.http.services.distilroberta-web.loadbalancer.server.port=8080

volumes:
  paquetes:   # ZIP de entregables generados desde la web (compartido por api y worker)

networks:
  interna:
    driver: overlay
  iagenteknet:
    external: true
  supabase_maestria:
    external: true
    name: supabase_maestria_internal

secrets:
  distilroberta_db_dsn:
    external: true
    name: distilroberta_db_dsn_v1
